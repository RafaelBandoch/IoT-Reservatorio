# ============================================================
# ACL do broker: quem publica (write) e quem assina (read) o quê.
# __PREFIXO__ é trocado pelo MQTT_PREFIXO do .env na subida.
# O que não está aqui é negado.
# ============================================================

# Backend: assina tudo do projeto e é o único que publica cmd,
# heartbeat e config.
user backend
topic readwrite __PREFIXO__/#

# Medidor: publica telemetria, alerta e status (inclusive o Last Will)
# e só assina o próprio config. Não lê nada do controlador.
user rsv-medidor-01
topic write __PREFIXO__/rsv-medidor-01/telemetria
topic write __PREFIXO__/rsv-medidor-01/alerta
topic write __PREFIXO__/rsv-medidor-01/status
topic read  __PREFIXO__/rsv-medidor-01/config

# Controlador: assina só cmd, config e o heartbeat do backend, e publica
# ack, estado e status. Não assina a telemetria do medidor.
user rsv-controlador-01
topic read  __PREFIXO__/rsv-controlador-01/cmd
topic read  __PREFIXO__/rsv-controlador-01/config
topic read  __PREFIXO__/backend/heartbeat
topic write __PREFIXO__/rsv-controlador-01/ack
topic write __PREFIXO__/rsv-controlador-01/estado
topic write __PREFIXO__/rsv-controlador-01/status
