# Configuração para simular no VS Code / Cursor com a extensão do Wokwi.
# O firmware é compilado localmente pelo arduino-cli, então não passa
# pela fila de compilação do site.
#
# Para recompilar depois de mexer no sketch:
#   ./compilar.sh n1                 # n1/sketch.ino (rodar na raiz do repositório)
#   ./compilar.sh sketch.ino.local   # cópia com as credenciais reais do cluster

[wokwi]
version = 1
firmware = '../build/n1/sketch.ino.merged.bin'
elf = '../build/n1/sketch.ino.elf'
